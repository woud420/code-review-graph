[package]
name = "code-review-graph-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
default-run = "code-review-graph"
license = "MIT"
description = "Local incremental code graph with SQLite-backed caller queries"
repository = "https://github.com/woud420/code-review-graph"
include = ["src/**", "assets/**", "tests/*.rs", "Cargo.toml", "LICENSE", "README.md"]

[[bin]]
name = "code-review-graph"
path = "src/public.rs"

[[bin]]
name = "code-review-graph-rs"
path = "src/main.rs"

[[bin]]
name = "crg-daemon"
path = "src/daemon_main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
globset = "0.4"
hex = "0.4"
ignore = "0.4"
indexmap = "2"
regex = "1"
rmcp = { version = "3.11", features = ["transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
signal-hook = "0.3"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1", features = ["rt", "process", "io-util", "io-std", "fs", "time", "sync", "macros", "signal"] }
tree-sitter = "0.26"
tree-sitter-bash = "0.25.1"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-sequel = "0.3.13"
tree-sitter-yaml = "0.7.2"
tree-sitter-hcl = "1.1"
tree-sitter-ruby = "0.23.1"
tree-sitter-typescript = "0.23"
unicode-normalization = "0.1"
tree-sitter-go = "0.25"
tree-sitter-json = "0.24.8"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-solidity = "1.2.13"
tree-sitter-lua = "0.5.0"
tree-sitter-luau = "1.2.0"
tree-sitter-php = "0.25.2"
tree-sitter-r = "1.3.0"
tree-sitter-nix = "0.3.0"
tree-sitter-zig = "1.1.2"
tree-sitter-xml = "0.7.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-swift = "0.7.4"

tempfile = "3"
csv = "1.4"
toml_edit = "0.25"
ureq = { version = "2.12", features = ["json"] }
url = "2.5"
tree-sitter-julia = "0.23.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tree-sitter-verilog = "1.0.3"
tree-sitter-elixir = "0.3.5"
tree-sitter-dart = "0.3.0"
notify = "8"
tree-sitter-scala = "0.26.13"
tree-sitter-gdscript = "6.1.0"
tree-sitter-objc = "3.0.2"
tree-sitter-perl = "1.1.2"
tree-sitter-html = "0.23.2"
