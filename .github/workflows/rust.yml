name: Rust port

on:
  push:
    branches: [rust-port-proof]
  pull_request:
    paths: ['rust/**', 'Cargo.*', 'rust-toolchain.toml', 'Makefile', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Native build and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: make check
      - run: make build
      - run: cargo package --locked -p code-review-graph-rs
      - name: Check and archive standalone executables
        shell: bash
        run: |
          tar -tzf target/package/code-review-graph-rs-*.crate > "$RUNNER_TEMP/package-members"
          if grep -E '\.py[co]?$' "$RUNNER_TEMP/package-members"; then exit 1; fi
          asset="code-review-graph-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz"
          tar -czf "$asset" -C target/release code-review-graph crg-daemon
          mkdir "$RUNNER_TEMP/native"
          tar -xzf "$asset" -C "$RUNNER_TEMP/native"
          env PATH="" "$RUNNER_TEMP/native/code-review-graph" --version
          env PATH="" "$RUNNER_TEMP/native/crg-daemon" --help
      - uses: actions/upload-artifact@v4
        with:
          name: code-review-graph-${{ runner.os }}-${{ runner.arch }}
          path: code-review-graph-*.tar.gz
          if-no-files-found: error

  compatibility:
    name: Python replacement gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: tirth8205/code-review-graph
          ref: 7ba9d17ab6fd281026b914d8da4c0dc98d013474
          path: reference
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --project reference --python 3.12 --frozen --group dev
      - run: make cutover REFERENCE=reference PYTHON=reference/.venv/bin/python
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: parity-reports
          path: target/parity/*.json
          if-no-files-found: warn
